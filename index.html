<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MAXUI BYPASS.TOLLS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0f1c;
      --card: #111827;
      --blue: #3b82f6;
      --blue-dark: #1d4ed8;
      --blue-light: #60a5fa;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --border: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      background-image: 
        radial-gradient(ellipse at top, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(29, 78, 216, 0.1) 0%, transparent 50%);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Header */
    .header { text-align: center; margin-bottom: 4px; }
    .header h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #60a5fa, #3b82f6, #1d4ed8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 14px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--blue-light);
      letter-spacing: 0.5px;
    }

    /* Video */
    .video-box {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 18px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group { display: flex; gap: 10px; }
    .input-group input {
      flex: 1;
      padding: 14px 18px;
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .input-group input::placeholder { color: #64748b; }

    .btn {
      padding: 14px 22px;
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      border: none;
      border-radius: 999px;
      color: white;
      font-weight: 600;
      font-size: 0.92rem;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(59,130,246,0.35);
    }
    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59,130,246,0.45);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Result permanently below */
    .result-permanent {
      margin-top: 14px;
      padding: 14px 18px;
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      word-break: break-all;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .result-permanent.success {
      border-color: rgba(34,197,94,0.5);
      color: var(--text);
    }
    .result-permanent a {
      color: var(--blue-light);
      text-decoration: none;
      flex: 1;
    }
    .result-permanent a:hover { text-decoration: underline; }
    .copy-btn {
      padding: 7px 12px;
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 999px;
      color: var(--blue-light);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Status */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      padding: 0 4px;
    }
    .limit-info { display: flex; align-items: center; gap: 6px; }
    .limit-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--success);
    }
    .limit-dot.warning { background: #f59e0b; }
    .limit-dot.danger { background: var(--danger); }

    .message {
      margin-top: 12px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.84rem;
      display: none;
    }
    .message.error {
      display: block;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }
    .message.success {
      display: block;
      background: rgba(34,197,94,0.12);
      border: 1px solid rgba(34,197,94,0.3);
      color: #86efac;
    }
    .message.info {
      display: block;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd;
    }

    .footer {
      text-align: center;
      margin-top: 8px;
      font-size: 0.72rem;
      color: #64748b;
    }

    /* ========== MODAL OVERLAY ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 18, 0.82);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.25s ease;
    }
    .modal-overlay.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      width: 100%;
      max-width: 320px;
      background: linear-gradient(160deg, #111827, #0f172a);
      border: 1.5px solid rgba(59,130,246,0.35);
      border-radius: 28px;
      padding: 28px 24px 24px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), 0 0 40px rgba(59,130,246,0.12);
      animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    @keyframes scaleIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Close X */
    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      line-height: 1;
    }
    .modal-close.visible { display: flex; }
    .modal-close:hover {
      background: rgba(239,68,68,0.2);
      color: #fca5a5;
    }

    /* Timer */
    .modal-timer {
      font-size: 3.2rem;
      font-weight: 800;
      color: var(--blue-light);
      line-height: 1;
      margin: 8px 0 6px;
      font-variant-numeric: tabular-nums;
    }
    .modal-timer-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    /* Loading bar */
    .loading-wrap {
      margin: 0 auto 16px;
      width: 80%;
    }
    .loading-bar {
      height: 5px;
      background: rgba(59,130,246,0.15);
      border-radius: 999px;
      overflow: hidden;
    }
    .loading-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue), var(--blue-light));
      border-radius: 999px;
      transition: width 0.3s linear;
    }
    .loading-text {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
    }

    /* Result inside modal */
    .modal-result {
      display: none;
      margin-top: 8px;
      padding: 12px 14px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 14px;
      word-break: break-all;
      font-size: 0.82rem;
      text-align: left;
    }
    .modal-result.visible { display: block; }
    .modal-result a {
      color: #86efac;
      text-decoration: none;
    }
    .modal-result a:hover { text-decoration: underline; }

    .modal-result-actions {
      display: none;
      gap: 8px;
      margin-top: 12px;
      justify-content: center;
    }
    .modal-result-actions.visible { display: flex; }

    .modal-action-btn {
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .modal-action-btn.open {
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      color: white;
    }
    .modal-action-btn.copy {
      background: rgba(59,130,246,0.15);
      border: 1px solid rgba(59,130,246,0.3);
      color: var(--blue-light);
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 400px) {
      .input-group { flex-direction: column; }
      .btn { width: 100%; }
      .header h1 { font-size: 1.45rem; }
      .video-box {
        max-width: 100%;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MAXUI BYPASS.TOLLS</h1>
      <div class="badge">FREE LIMIT 10X / HARI</div>
    </div>

    <!-- Video (sudah termasuk musik) -->
    <div class="video-box">
      <video id="mainVideo" playsinline loop muted autoplay>
        <source src="https://raw.githubusercontent.com/NOVABOTV1F/BOT_KEY_WEB/main/tiktokio.com1791268330_39vUti4Rh3XA5sskjclN.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Input -->
    <div class="card">
      <div class="card-label">Paste Link yang Mau di Bypass</div>
      <div class="input-group">
        <input type="url" id="linkInput" placeholder="https://linkvertise.com/..." autocomplete="off" />
        <button class="btn" id="bypassBtn" onclick="startBypass()">Bypass</button>
      </div>

      <div class="card-label" style="margin-top:14px;">Hasil Bypass</div>
      <div class="result-permanent" id="resultPermanent">
        <span id="resultText">Hasil akan muncul di sini</span>
      </div>

      <div class="message" id="msgBox"></div>
    </div>

    <div class="status-bar">
      <div class="limit-info">
        <div class="limit-dot" id="limitDot"></div>
        <span id="limitText">Sisa kuota: 10/10</span>
      </div>
      <span id="statusText">Siap</span>
    </div>

    <div class="footer">MAXUI BYPASS.TOLLS &copy; 2026</div>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" onclick="closeModal()">✕</button>

      <div class="modal-timer" id="modalTimer">2</div>
      <div class="modal-timer-label" id="modalTimerLabel">Sedang memproses...</div>

      <div class="loading-wrap" id="loadingWrap">
        <div class="loading-bar">
          <div class="loading-bar-fill" id="loadingFill"></div>
        </div>
        <div class="loading-text" id="loadingText">Bypassing link...</div>
      </div>

      <div class="modal-result" id="modalResult"></div>
      <div class="modal-result-actions" id="modalActions">
        <button class="modal-action-btn open" id="openBtn">Buka Link</button>
        <button class="modal-action-btn copy" id="copyBtn">Copy</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_DAILY = 10;
    const STORAGE_KEY = 'maxui_bypass_v2';
    let isProcessing = false;
    let currentResult = '';
    let soundUnlocked = false;

    // Video autoplay (muted dulu biar browser izinkan)
    const vid = document.getElementById('mainVideo');
    vid.muted = true;
    vid.play().catch(() => {});

    // Klik di mana saja → unmute video (musik ikut nyala)
    document.addEventListener('click', function unlockSound() {
      if (soundUnlocked) return;
      soundUnlocked = true;
      vid.muted = false;
      vid.play().catch(() => {});
    });

    // ===== Limit System (robust) =====
    function getTodayKey() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function getUsage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { date: getTodayKey(), count: 0 };
        const data = JSON.parse(raw);
        if (!data || typeof data.count !== 'number' || data.date !== getTodayKey()) {
          return { date: getTodayKey(), count: 0 };
        }
        return { date: data.date, count: Math.min(data.count, MAX_DAILY) };
      } catch {
        return { date: getTodayKey(), count: 0 };
      }
    }

    function saveUsage(count) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          date: getTodayKey(),
          count: Math.min(count, MAX_DAILY)
        }));
      } catch {}
    }

    function remainingQuota() {
      return Math.max(0, MAX_DAILY - getUsage().count);
    }

    function updateLimitUI() {
      const remaining = remainingQuota();
      document.getElementById('limitText').textContent = 'Sisa kuota: ' + remaining + '/' + MAX_DAILY;
      const dot = document.getElementById('limitDot');
      dot.className = 'limit-dot';
      if (remaining <= 0) dot.classList.add('danger');
      else if (remaining <= 3) dot.classList.add('warning');
    }

    function canBypass() {
      return remainingQuota() > 0 && !isProcessing;
    }

    function addUsage() {
      const usage = getUsage();
      saveUsage(usage.count + 1);
      updateLimitUI();
    }

    // ===== UI Helpers =====
    function showMsg(text, type) {
      const box = document.getElementById('msgBox');
      box.className = 'message ' + type;
      box.textContent = text;
    }
    function clearMsg() {
      document.getElementById('msgBox').className = 'message';
      document.getElementById('msgBox').textContent = '';
    }
    function setStatus(t) {
      document.getElementById('statusText').textContent = t;
    }
    function setLoading(on) {
      const btn = document.getElementById('bypassBtn');
      if (on) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';
      } else {
        btn.disabled = false;
        btn.textContent = 'Bypass';
      }
    }

    // ===== Modal =====
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('modalClose').classList.remove('visible');
      document.getElementById('modalResult').classList.remove('visible');
      document.getElementById('modalActions').classList.remove('visible');
      document.getElementById('loadingWrap').style.display = 'block';
      document.getElementById('modalTimerLabel').textContent = 'Sedang memproses...';
      document.getElementById('loadingText').textContent = 'Bypassing link...';
      document.getElementById('loadingFill').style.width = '0%';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // Random wait 1 / 2 / 3 detik
    function getRandomWait() {
      const options = [1, 2, 3];
      return options[Math.floor(Math.random() * options.length)];
    }

    function runCountdown(seconds) {
      return new Promise(resolve => {
        const timerEl = document.getElementById('modalTimer');
        const fillEl = document.getElementById('loadingFill');
        let left = seconds;
        timerEl.textContent = left;
        fillEl.style.width = '0%';

        const total = seconds;
        const start = Date.now();

        const tick = setInterval(() => {
          const elapsed = (Date.now() - start) / 1000;
          const progress = Math.min(elapsed / total, 1);
          fillEl.style.width = (progress * 100) + '%';

          const remain = Math.ceil(total - elapsed);
          if (remain !== left && remain >= 0) {
            left = remain;
            timerEl.textContent = left;
          }

          if (elapsed >= total) {
            clearInterval(tick);
            fillEl.style.width = '100%';
            timerEl.textContent = '0';
            resolve();
          }
        }, 50);
      });
    }

    // ===== Main Bypass =====
    async function startBypass() {
      if (isProcessing) return;
      clearMsg();

      const url = document.getElementById('linkInput').value.trim();
      if (!url) {
        showMsg('Masukkan link dulu ya!', 'error');
        return;
      }
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        showMsg('Link harus diawali http:// atau https://', 'error');
        return;
      }
      if (remainingQuota() <= 0) {
        showMsg('Kuota hari ini sudah habis (10x). Coba lagi besok!', 'error');
        setStatus('Limit tercapai');
        return;
      }

      isProcessing = true;
      setLoading(true);
      setStatus('Memproses...');
      openModal();

      const waitSec = getRandomWait(); // 1, 2, atau 3

      try {
        // Start API + countdown parallel
        const apiPromise = fetch('https://api.bypass.vip/bypass?url=' + encodeURIComponent(url))
          .then(r => r.json());

        await runCountdown(waitSec);

        const data = await apiPromise;

        if (data && data.status === 'success' && data.result) {
          currentResult = data.result;

          // Update modal
          document.getElementById('modalTimer').textContent = '✓';
          document.getElementById('modalTimerLabel').textContent = 'Bypass berhasil!';
          document.getElementById('loadingText').textContent = 'Selesai';
          document.getElementById('loadingWrap').style.display = 'none';

          const resEl = document.getElementById('modalResult');
          resEl.innerHTML = '<a href="' + data.result + '" target="_blank" rel="noopener">' + data.result + '</a>';
          resEl.classList.add('visible');

          document.getElementById('modalActions').classList.add('visible');
          document.getElementById('openBtn').onclick = () => window.open(data.result, '_blank');
          document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(data.result).then(() => {
              document.getElementById('copyBtn').textContent = 'Tersalin!';
              setTimeout(() => document.getElementById('copyBtn').textContent = 'Copy', 1500);
            });
          };

          // Show X close button
          document.getElementById('modalClose').classList.add('visible');

          // Also update permanent result below
          const perm = document.getElementById('resultPermanent');
          perm.className = 'result-permanent success';
          perm.innerHTML = '<a href="' + data.result + '" target="_blank" rel="noopener">' + data.result + '</a>' +
            '<button class="copy-btn" onclick="navigator.clipboard.writeText(\'' + data.result + '\')">Copy</button>';

          addUsage();
          showMsg('Bypass berhasil!', 'success');
          setStatus('Selesai');
        } else {
          throw new Error((data && data.message) ? data.message : 'Gagal bypass link ini');
        }
      } catch (err) {
        document.getElementById('modalTimer').textContent = '!';
        document.getElementById('modalTimerLabel').textContent = 'Gagal';
        document.getElementById('loadingText').textContent = err.message || 'Terjadi kesalahan';
        document.getElementById('modalClose').classList.add('visible');
        showMsg(err.message || 'Terjadi kesalahan. Coba lagi.', 'error');
        setStatus('Gagal');
      } finally {
        isProcessing = false;
        setLoading(false);
      }
    }

    // Enter key
    document.getElementById('linkInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') startBypass();
    });

    // Click overlay to close only when done
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modalOverlay') &&
          document.getElementById('modalClose').classList.contains('visible')) {
        closeModal();
      }
    });

    // Init
    updateLimitUI();
  </script>
</body>
</html>
